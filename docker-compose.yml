services:
  postgres-db:
    image: postgres:17-alpine
    container_name: travel_planner_db
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travel-network

volumes:
  postgres_data:

networks:
  travel-network:
    driver: bridge