# Pipeline de CI para el Frontend (React + Vite + TypeScript)
# Validaciones: ESLint (lint), TypeScript + Vite (build)
# Se ejecuta únicamente cuando hay cambios en el directorio frontend/

name: Frontend CI

on:
  push:
    branches: [ "main", "develop", "feature/*", "fix/*" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Build (TypeScript + Vite)
        working-directory: ./frontend
        run: npm run build
