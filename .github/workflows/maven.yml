# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop", "feature/*", "fix/*" ]
    paths:
      - "backend/**"
      - ".github/workflows/maven.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
      - ".github/workflows/maven.yml"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_tester
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: travel_planner_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      working-directory: ./backend
      env:
        DB_URL: jdbc:postgresql://localhost:5433/travel_planner_test
        DB_USER: ci_tester
        DB_PASSWORD: ci_test_password
        CORS_ALLOWED_ORIGINS: http://localhost:5173
        JWT_SECRET: c2VjcmV0LWtleS1kZS1wcnVlYmEtcGFyYS10ZXN0aW5nLWRlbC1iYWNrZW5kLXRyYXZlbC1wbGFubmVy
        SWAGGER_ENABLED: true
      run: mvn -B clean verify

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
        directory: ./backend
