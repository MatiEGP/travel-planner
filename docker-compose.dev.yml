services:
  postgres-db:
    image: postgres:17-alpine
    container_name: ${POSTGRES_DB}_db_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - travel-network-dev

  backend:
    # Usamos directamente la imagen del JDK, sin compilar un .jar estático
    image: eclipse-temurin:17-jdk-jammy
    container_name: travel_planner_backend_dev
    working_dir: /app
    volumes:
      - ./backend:/app
      # Guardamos la caché de Maven en un volumen para no descargar dependencias cada vez
      - maven-repo:/root/.m2
    # Ejecutamos el servidor de desarrollo de Spring Boot
    command: ./mvnw spring-boot:run
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    networks:
      - travel-network-dev

  frontend:
    image: node:20-alpine
    container_name: travel_planner_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL}
    depends_on:
      - backend
    networks:
      - travel-network-dev

volumes:
  postgres_data_dev:
  maven-repo:

networks:
  travel-network-dev:
    driver: bridge
