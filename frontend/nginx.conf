server {
    listen 80;
    
    # Raíz donde se sirven los archivos estáticos
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router: redirige cualquier ruta 404 al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Proxy reverso para evitar problemas de CORS si la API estuviera en el mismo dominio
    # location /api/ {
    #     proxy_pass http://backend:8080/api/;
    # }
}
