spring:
  application:
    name: api

  datasource:
    # Estas variables DEBEN ser inyectadas por entorno o por el archivo .env local
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: "org.postgresql.Driver"

  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: "org.hibernate.dialect.PostgreSQLDialect"
server:
  port: 8080

app:
  cors:
    # Orígenes permitidos inyectados por variable de entorno.
    # En local suele ser http://localhost:5173, en producción la URL de Vercel/Frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}