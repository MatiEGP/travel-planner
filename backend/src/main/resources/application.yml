spring:
  application:
    name: api

  datasource:
    # Estas variables DEBEN ser inyectadas por entorno o por el archivo .env local
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: "org.postgresql.Driver"

  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    database-platform: "org.hibernate.dialect.PostgreSQLDialect"
server:
  port: 8080

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  cors:
    # Orígenes permitidos inyectados por variable de entorno.
    # En local suele ser http://localhost:5173, en producción la URL de Vercel/Frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    # Clave simétrica en Base64 (mínimo 256 bits = 32 bytes). Generar con:
    #   openssl rand -base64 32
    secret: ${JWT_SECRET}
    # Tiempo de vida del token en milisegundos.
    # Desarrollo: 86400000 (24h) | Producción: 3600000 (1h)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # Flag Secure para cookies HttpOnly (false en desarrollo local HTTP, true en producción HTTPS)
    cookie-secure: ${JWT_COOKIE_SECURE:false}
